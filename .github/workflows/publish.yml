name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . pytest ruff mypy
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/bili_dl
      - run: pytest
      - run: python scripts/release.py check "$GITHUB_REF_NAME"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Reject unexpected source-distribution files
        shell: python
        run: |
          import tarfile
          from pathlib import Path

          forbidden = {
              "tmp",
              "output",
              "auth_state.json",
              "cookies_all.txt",
              "cookies_bilibili.txt",
              ".auth_state.lock",
          }
          for archive in Path("dist").glob("*.tar.gz"):
              with tarfile.open(archive) as package:
                  unsafe = [
                      name
                      for name in package.getnames()
                      if any(part in forbidden or part.startswith(".env") for part in Path(name).parts)
                  ]
              if unsafe:
                  raise SystemExit(f"unsafe source-distribution entries: {unsafe}")
      - run: pip install dist/*.whl
      - run: bili-dl -V
      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          from importlib.metadata import version

          expected = f"v{version('bili-dl')}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package version {expected!r}")
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract this tag's changelog section
        run: python scripts/release.py notes "$GITHUB_REF_NAME" release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
